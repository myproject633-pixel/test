<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registration Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px;
    width: 100%; max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  h1 { font-size: 22px; color: #333; margin-bottom: 6px; text-align: center; }
  .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #e0e0e0; border-radius: 10px;
    font-size: 15px; margin-bottom: 16px;
    transition: border 0.2s; outline: none;
  }
  input:focus { border-color: #667eea; }
  button {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 16px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover:not(:disabled) { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    margin-top: 16px; padding: 12px; border-radius: 8px;
    font-size: 14px; text-align: center; display: none;
  }
  .msg.success { display:block; background:#e7f7ee; color:#1a7f4b; }
  .msg.error   { display:block; background:#fdecec; color:#c0392b; }
</style>
</head>
<body>

<div class="card">
  <h1>Registration Form</h1>
  <p class="subtitle">Please fill in your details</p>

  <form id="regForm" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required />

    <label for="guardian">Guardian</label>
    <input type="text" id="guardian" name="guardian" placeholder="Enter guardian name" required />

    <label for="mobile">Mobile No</label>
    <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required />

    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <div id="msg" class="msg"></div>
</div>

<script>
  // 🔴 REPLACE with your Apps Script Web App URL (must end in /exec)
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx40t8giOvuWRb8Or1_vzKaGkxx2EML2ZIGT_pTECv1JsZ9806gLK3HPS5-UiCqo4b3UQ/exec';

  const form   = document.getElementById('regForm');
  const btn    = document.getElementById('submitBtn');
  const msgBox = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg();

    const payload = {
      name:     form.name.value.trim(),
      guardian: form.guardian.value.trim(),
      mobile:   form.mobile.value.trim()
    };

    // Client-side validation
    if (!payload.name)     return showMsg('Please enter your name.', 'error');
    if (!payload.guardian) return showMsg('Please enter guardian name.', 'error');
    if (!payload.mobile)   return showMsg('Please enter mobile number.', 'error');
    if (!/^[0-9+\-\s]{7,15}$/.test(payload.mobile))
      return showMsg('Please enter a valid mobile number.', 'error');

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      // Form-encoded avoids CORS preflight with Apps Script
      const body = new URLSearchParams();
      body.append('name',     payload.name);
      body.append('guardian', payload.guardian);
      body.append('mobile',   payload.mobile);

      const res    = await fetch(WEB_APP_URL, {
        method:  'POST',
        body:    body,
        redirect: 'follow'
      });

      const result = await res.json();

      if (result.status === 'success') {
        showMsg('✅ ' + result.message, 'success');
        form.reset();                          // ⬅️ clear all fields
        document.getElementById('name').focus();
      } else {
        showMsg('❌ ' + (result.message || 'Submission failed.'), 'error');
      }
    } catch (err) {
      showMsg('❌ Network error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit';
    }
  });

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className   = 'msg ' + type;
  }
  function hideMsg() {
    msgBox.className   = 'msg';
    msgBox.textContent = '';
    msgBox.style.display = 'none';
  }
</script>

</body>
</html>
